<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Malak Box 💜</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{overflow-x:hidden;color:#fff;background:linear-gradient(135deg,#4d216f,#9a3f9c 52%,#ef91c6)}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 20% 20%,#ffd8f544,transparent 25%),radial-gradient(circle at 80% 70%,#cdb1ff44,transparent 28%);pointer-events:none}.letters{position:fixed;inset:0;pointer-events:none;overflow:hidden}.letters span{position:absolute;color:#fff1;font-size:78px;font-weight:900;transform:rotate(var(--r))}
main{max-width:960px;margin:auto;padding:26px 16px 80px;position:relative;z-index:2}h1{text-align:center;font-size:clamp(42px,10vw,70px);margin:0;text-shadow:0 8px 25px #2b0d40}.tag{text-align:center;opacity:.9;margin-bottom:25px}.home{display:flex;justify-content:center;align-items:center;gap:20px;flex-wrap:wrap}.gift{width:230px;height:230px;border:0;background:none;color:white;position:relative;cursor:pointer}.box{position:absolute;left:50%;bottom:35px;transform:translateX(-50%);width:150px;height:110px;border-radius:12px;background:linear-gradient(145deg,#ee76c5,#7141ae);box-shadow:0 22px 40px #260b3c88}.lid{position:absolute;z-index:2;left:50%;top:52px;transform:translateX(-50%);width:178px;height:44px;border-radius:11px;background:linear-gradient(145deg,#ffabd9,#8e4cba);transition:.55s}.gift:hover .lid{transform:translateX(-50%) translateY(-13px) rotate(-3deg)}.label{position:absolute;bottom:5px;left:0;right:0;font-size:18px;font-weight:800}.recordArea{position:relative;width:330px;height:330px;display:grid;place-items:center}.record{width:185px;height:185px;border-radius:50%;background:repeating-radial-gradient(circle,#111 0 2px,#38323c 3px 4px);border:8px solid #151019;box-shadow:0 20px 40px #21092f88;animation:spin 3s linear infinite;animation-play-state:paused}.record.playing{animation-play-state:running}.record:after{content:'O + M';position:absolute;display:grid;place-items:center;width:58px;height:58px;margin:55px;background:#e47fc2;border-radius:50%;font-size:11px;font-weight:900}@keyframes spin{to{transform:rotate(360deg)}}.around{position:absolute;inset:0}.polaroid{position:absolute;width:85px;padding:6px 6px 20px;background:#fff;box-shadow:0 12px 25px #210b3388;transform:rotate(var(--r));transition:.35s}.polaroid:hover{transform:rotate(0) scale(1.08);z-index:4}.polaroid img{width:100%;height:80px;object-fit:cover}.p1{top:5px;left:5px}.p2{top:15px;right:0}.p3{bottom:15px;left:0}.p4{bottom:0;right:15px}.p5{top:120px;left:-20px}.p6{top:125px;right:-20px}.panel{background:#ffffff1d;border:1px solid #fff4;border-radius:26px;padding:22px;margin-top:25px;backdrop-filter:blur(14px);box-shadow:0 20px 60px #2b0d3f55}.hidden{display:none}.close,.start{border:0;border-radius:13px;padding:11px 16px;background:#fff;color:#713d9e;font-weight:800;cursor:pointer}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.print{background:#fff;padding:8px 8px 24px;box-shadow:0 12px 25px #230b3688;transform:rotate(var(--r));color:#444}.print img{width:100%;height:210px;object-fit:cover}.letter{white-space:pre-line;line-height:2;font-size:17px}.signature{text-align:center;font-size:24px;font-weight:900;line-height:1.8}.bigwrap{text-align:center;margin-top:45px}.biggift{width:310px;height:250px;border:0;background:none;position:relative;cursor:pointer}.biggift .box{width:235px;height:150px}.biggift .lid{width:270px;height:58px;top:35px}.hint{font-weight:800}.game{height:320px;position:relative;overflow:hidden;border-radius:24px;background:linear-gradient(#9c73ce,#efacd0);border:2px solid #fff5;touch-action:none}.ground{position:absolute;left:0;right:0;bottom:58px;height:5px;background:#fff8}.girl{position:absolute;left:70px;bottom:63px;width:45px;height:72px;z-index:2}.girl .head{width:27px;height:27px;background:#ffd0ba;border-radius:50%;margin:auto}.girl .hair{width:32px;height:22px;background:#3b2034;border-radius:50% 50% 30% 30%;position:absolute;top:0;left:6px}.girl .body{width:30px;height:38px;background:#e36cae;border-radius:12px;margin:auto}.girl .legs{width:36px;height:12px;background:#29212e;border-radius:9px;margin:auto}.wall{position:absolute;bottom:63px;width:38px;height:92px;background:linear-gradient(90deg,#744b70,#b86a9b);border-radius:6px;box-shadow:inset 7px 0 #ffffff18}.finishboy{position:absolute;right:-120px;bottom:65px;font-size:70px}.final{position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle,#fff,#ffd7f3 32%,#703c9d)}.final.show{display:flex}.hug{font-size:70px;animation:hug 1.5s forwards}.heart{position:absolute;font-size:55px;animation:heart 2.5s 1.2s forwards}.finalWords{position:absolute;top:64%;opacity:0;animation:words 1s 2.7s forwards}.finalWords strong{font-size:55px;display:block}.finalWords span{font-size:20px;font-weight:800}@keyframes hug{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}@keyframes heart{to{transform:translateY(-130px) scale(1.7);opacity:0}}@keyframes words{to{opacity:1}}
@media(max-width:700px){.recordArea{width:300px;height:300px}.gallery{grid-template-columns:repeat(2,1fr)}.print img{height:160px}.polaroid{width:72px}.polaroid img{height:67px}}
</style></head>
<body>
<div class="letters"><span style="top:4%;left:12%;--r:-12deg">O</span><span style="top:20%;right:10%;--r:14deg">M</span><span style="top:45%;left:2%;--r:8deg">M</span><span style="top:65%;right:5%;--r:-15deg">O</span><span style="top:84%;left:25%;--r:10deg">M</span></div>
<main><h1>Malak Box 💜</h1><div class="tag">A small box made for you.</div>
<section class="home">
<button class="gift" onclick="openPanel('photos')"><div class="lid"></div><div class="box"></div><div class="label">📸 Our Photos</div></button>
<div class="recordArea"><div class="around" id="around"></div><div class="record" id="record"></div></div>
<button class="gift" onclick="openPanel('song')"><div class="lid"></div><div class="box"></div><div class="label">🎵 Our Song</div></button>
</section>
<section class="panel" style="text-align:center"><h2>🎵 تشغيل الأغنية</h2><audio id="audio" controls src="music/song.m4a"></audio></section>
<section id="photos" class="panel hidden"><button class="close" onclick="closePanel('photos')">Back</button><h2>📸 Photos</h2><div class="gallery" id="gallery"></div></section>
<section id="song" class="panel hidden"><button class="close" onclick="closePanel('song')">Back</button><h2>🎵 Our Song</h2><div style="text-align:center"><div class="record" style="margin:20px auto"></div><audio controls src="music/song.m4a"></audio></div></section>
<section class="panel bigwrap"><h2>🎁 The Big Gift</h2><p class="hint">اضغطي عليها باش تبدا المفاجأة</p><button class="biggift" onclick="startGame()"><div class="lid"></div><div class="box"></div></button></section>
<section id="gamePanel" class="panel hidden" style="text-align:center"><h2>🏃‍♀️ Malak's Run</h2><p>قفزي فوق 6 حيطان — ضغطي على الشاشة أو SPACE.</p><div id="game" class="game"><div class="ground"></div><div class="girl" id="girl"><div class="hair"></div><div class="head"></div><div class="body"></div><div class="legs"></div></div></div><p id="score">0 / 6</p><button class="start" onclick="resetGame()">Restart</button></section>
</main>
<div id="final" class="final"><div class="hug">👧🏻 🫂 👦🏻<div class="heart">❤️</div></div><div class="finalWords"><strong>O + M for ever</strong><span>Omar and Malak for ever</span></div></div>
<script>
const photos = ["35684AD6-ACBA-4CBF-AC5E-70866148F0CF.png", "35b08bdf-ba86-46fb-86af-ea77b532e64a.jpeg", "46c0cea0-3e5a-4508-bde7-a3766448f844.jpeg", "EA6DB81A-21C3-44EB-8BC5-9FC9A4D44699.jpeg", "IMG_1646.jpeg", "IMG_2954.jpeg", "b5debd4b-b10a-4ba2-96e0-8ac8d1a1ea3d.jpeg", "extra1.jpeg", "extra2.jpeg"];
const gallery=document.getElementById('gallery'); photos.forEach((p,i)=>{const d=document.createElement('div');d.className='print';d.style.setProperty('--r',(i%2?'3':'-3')+'deg');d.innerHTML='<img src="photos/'+p.replaceAll('"','&quot;')+'">';gallery.appendChild(d)});
const around=document.getElementById('around'); photos.slice(0,6).forEach((p,i)=>{const d=document.createElement('div');d.className='polaroid p'+(i+1);d.style.setProperty('--r',((i%2?1:-1)*(4+i*2))+'deg');d.innerHTML='<img src="photos/'+p.replaceAll('"','&quot;')+'">';around.appendChild(d)});
function openPanel(id){const e=document.getElementById(id);e.classList.remove('hidden');e.scrollIntoView({behavior:'smooth'})}function closePanel(id){document.getElementById(id).classList.add('hidden')}
const audio=document.getElementById('audio'),record=document.getElementById('record');audio.addEventListener('play',()=>record.classList.add('playing'));audio.addEventListener('pause',()=>record.classList.remove('playing'));
let running=false,jumping=false,count=0,raf,obs=[];
function startGame(){document.getElementById('gamePanel').classList.remove('hidden');document.getElementById('gamePanel').scrollIntoView({behavior:'smooth'});resetGame()}
function resetGame(){cancelAnimationFrame(raf);const g=document.getElementById('game');g.querySelectorAll('.wall,.finishboy').forEach(x=>x.remove());obs=[];count=0;running=true;jumping=false;document.getElementById('score').textContent='0 / 6';for(let i=0;i<6;i++){let w=document.createElement('div');w.className='wall';w.style.left=(430+i*220)+'px';g.appendChild(w);obs.push(w)}loop()}
function jump(){if(!running||jumping)return;jumping=true;let y=0,up=true;function f(){y+=up?9:-9;if(y>=120)up=false;document.getElementById('girl').style.transform='translateY('+(-y)+'px)';if(y>0)requestAnimationFrame(f);else{document.getElementById('girl').style.transform='';jumping=false}}f()}
function loop(){if(!running)return;for(let i=0;i<obs.length;i++){let w=obs[i],x=parseFloat(w.style.left)-3;w.style.left=x+'px';if(x<-50){x=1080+i*40;w.style.left=x+'px';w.dataset.passed=''}if(x<115&&x>50&&!jumping){running=false;document.getElementById('score').textContent='Try again 💜';return}if(!w.dataset.passed&&x<35){w.dataset.passed='1';count++;document.getElementById('score').textContent=count+' / 6';if(count===6){running=false;setTimeout(()=>finishGame(),700)}}}raf=requestAnimationFrame(loop)}
function finishGame(){const g=document.getElementById('game');const b=document.createElement('div');b.className='finishboy';b.textContent='👦🏻';b.style.right='130px';g.appendChild(b);setTimeout(()=>document.getElementById('final').classList.add('show'),1100)}
document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}});document.getElementById('game').addEventListener('pointerdown',jump);

// Automatically load every image found in /photos/.
// No specific filenames are required.
(async function(){
  const gallery=document.getElementById('photoGallery');
  if(!gallery) return;

  const extensions=['jpg','jpeg','png','webp','gif','JPG','JPEG','PNG','WEBP','GIF'];
  const found=[];

  // Try common browser-readable names generated by the project manifest.
  // If photos.json exists, use it; otherwise the fallback below loads known slots.
  try{
    const r=await fetch('photos.json',{cache:'no-store'});
    if(r.ok){
      const names=await r.json();
      names.forEach(name=>{
        if(typeof name==='string' && extensions.some(ext=>name.toLowerCase().endsWith('.'+ext.toLowerCase())))
          found.push(name);
      });
    }
  }catch(e){}

  // photos.json is generated alongside this page, so normal use needs no renaming.
  found.forEach(name=>{
    const img=document.createElement('img');
    img.src='photos/'+encodeURIComponent(name);
    img.alt='Malak ❤️';
    img.loading='lazy';
    gallery.appendChild(img);
  });
})();
</script></body></html>
